<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" role="img" aria-label="Young Pro Ministry — Faith Temple Baptist Church">
  <title>Young Pro Ministry — Faith Temple Baptist Church</title>
  <defs>
    <linearGradient id="lkEmerald" x1="14" y1="14" x2="62" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34E29B"/>
      <stop offset="1" stop-color="#149B63"/>
    </linearGradient>
    <linearGradient id="lkGold" x1="42" y1="6" x2="60" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6CE63"/>
      <stop offset="1" stop-color="#D99A2B"/>
    </linearGradient>
    <linearGradient id="lkWord" x1="92" y1="20" x2="92" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3EFE3"/>
      <stop offset="1" stop-color="#CFE8DB"/>
    </linearGradient>
  </defs>

  <!-- ===== MARK (same monogram, scaled into 8..72) ===== -->
  <g>
    <rect x="8" y="8" width="64" height="64" rx="17" fill="#0A1F17"/>
    <rect x="8.8" y="8.8" width="62.4" height="62.4" rx="16.2" fill="none" stroke="url(#lkEmerald)" stroke-opacity="0.45" stroke-width="1.6"/>

    <!-- Y (left) -->
    <path d="M20.4 25 L28.4 38.9 L28.4 56" fill="none" stroke="url(#lkEmerald)" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36.4 25 L28.4 38.9" fill="none" stroke="url(#lkEmerald)" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- P (right) -->
    <path d="M43.3 56 L43.3 25 L52.9 25 A10.1 10.1 0 0 1 52.9 45.3 L43.3 45.3" fill="none" stroke="url(#lkEmerald)" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Gold leaf apex rising off the Y's right arm -->
    <path d="M36.4 24.5 C36.4 17.5 41.8 13 48.3 12.5 C47.7 19.2 43.3 24 36.4 24.5 Z" fill="url(#lkGold)"/>
    <path d="M40.8 21.2 C43.5 19.6 46.1 18.3 47.8 13.7" fill="none" stroke="#0A1F17" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- ===== WORDMARK ===== -->
  <text x="90" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700"
        letter-spacing="0.4" fill="url(#lkWord)">Young Pro</text>

  <!-- emerald hairline + gold dot divider -->
  <line x1="91" y1="51.5" x2="270" y2="51.5" stroke="#1F8E5E" stroke-width="1.2" stroke-opacity="0.55"/>
  <circle cx="276" cy="51.5" r="1.7" fill="url(#lkGold)"/>

  <!-- ===== SUBLINE ===== -->
  <text x="91.5" y="65.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.6"
        font-weight="600" letter-spacing="3.1" fill="#9FC9B6">FAITH TEMPLE BAPTIST CHURCH</text>
</svg>
